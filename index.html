<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nano Banana API Studio for RunningHub</title><style>
*{box-sizing:border-box}body{margin:0;background:#161917;color:#f0f2ea;font:15px system-ui}header,footer{padding:20px 4vw;border-bottom:1px solid #434741}header b{color:#d7fc77;font-size:22px}small{color:#adb7ad;letter-spacing:.12em}main{display:grid;grid-template-columns:320px 1fr;min-height:78vh}aside{background:#242823;padding:28px}label{display:block;margin:20px 0 6px}textarea,select,input,button{width:100%;padding:12px;border-radius:8px;border:1px solid #51584c;background:#181c18;color:inherit}textarea{resize:vertical}button{margin-top:20px;background:#d7fc77;color:#20251a;font-weight:bold;cursor:pointer}button:disabled{opacity:.55}section{display:grid;place-items:center;padding:30px;background:radial-gradient(#484f42 1px,transparent 1px) 0 0/18px 18px;text-align:center}img{max-width:100%;max-height:65vh}a{color:#d7fc77}footer{color:#afb7aa}@media(max-width:720px){main{grid-template-columns:1fr}section{min-height:35vh}}</style>
<header><b>Nano Banana API Studio</b>　<small>RUNNINGHUB / IMAGE LAB</small></header><main><aside><small>01　创作设置</small><label for="mode">工作模式</label><select id="mode"><option value="generate">文字生成图片</option><option value="edit">编辑参考图</option></select><div id="ref" hidden><label for="file">参考图 · 最大 10 MB</label><input type="file" id="file" accept="image/png,image/jpeg,image/webp"></div><label for="promptBox">创作指令</label><textarea id="promptBox" rows="5" placeholder="描述画面，或说明你想修改的部分…"></textarea><label for="ratio">画幅</label><select id="ratio"><option>1:1</option><option>16:9</option><option>9:16</option><option>3:4</option></select><label for="quality">分辨率</label><select id="quality"><option>1k</option><option>2k</option><option>4k</option></select><button id="run">开始创作 →</button></aside><section><div><small>02　画布预览</small><p id="state" role="status">你的作品将在这里呈现</p><img id="pic" hidden alt="画布"><p><a id="out" hidden target="_blank" rel="noopener">打开原图并保存 ↗</a></p></div></section></main><footer>Nano Banana Pro　/　RunningHub</footer><script>
mode.onchange=()=>ref.hidden=mode.value!=='edit';
file.onchange=()=>{if(file.files[0]){pic.src=URL.createObjectURL(file.files[0]);pic.hidden=false;out.hidden=true}};
async function post(path,data,type='application/json'){let r=await fetch('/'+path,{method:'POST',headers:{'Content-Type':type,'X-Studio':'1'},body:type==='application/json'?JSON.stringify(data):data});let j=await r.json();if(!r.ok||j.errorMessage||j.status==='FAILED')throw Error(j.errorMessage||j.message||'请求失败');return j}
run.onclick=async()=>{run.disabled=true;try{let p={prompt:promptBox.value.trim(),resolution:quality.value,aspectRatio:ratio.value},action=mode.value;if(!p.prompt)throw Error('请先填写创作指令');if(action==='edit'){let f=file.files[0];if(!f||f.size>10485760)throw Error('请选择 10 MB 以内的参考图');state.textContent='正在上传参考图…';let u=await post('upload',f,f.type);let url=u.data?.download_url||u.data?.url;if(!url)throw Error(u.msg||'未取得上传地址');p.imageUrls=[url]}state.textContent='正在提交…';let t=await post(action,p);if(!t.taskId)throw Error(t.message||'未取得任务编号');for(let i=0;i<180;i++){state.textContent='生成中 · '+t.taskId;await new Promise(r=>setTimeout(r,3500));let j=await post('query',{taskId:t.taskId});if(j.status==='SUCCESS'){let url=j.results?.[0]?.url;if(!url||!url.startsWith('https://'))throw Error('没有可用的结果图片');pic.src=out.href=url;pic.hidden=out.hidden=false;state.textContent='创作完成';return}}throw Error('等待超时，任务编号：'+t.taskId)}catch(e){state.textContent=e.message}finally{run.disabled=false}};
</script></html>
